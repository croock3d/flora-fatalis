spring:
  application:
    name: flora-fatalis
  datasource:
    url: jdbc:postgresql://localhost:5433/flora_fatalis
    username: postgress
    password: postgress
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    contexts: dev
  jmx:
    enabled: false
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  photos:
    dir: uploads
    seed-demo: true
  timezone: Europe/Warsaw

logging:
  level:
    liquibase: INFO
    sun:
      rmi:
        transport:
          tcp: ERROR
